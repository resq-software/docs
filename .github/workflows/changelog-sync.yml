#
# Keeps changelog.mdx current with published SDK releases. Regenerates the
# autogenerated region from GitHub release data across the five SDK repos and
# opens a PR when it changes. The generator is deterministic, so a run with no
# new releases produces no diff and no PR.
#
# There is deliberately no pull_request check job: --check regenerates from
# live release data, so it would fail any PR opened after a new release, even
# an unrelated one. The scheduled run is the mechanism; review the PR it opens.

name: changelog sync

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Releases are infrequent; a daily run would
    # mostly open nothing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The built-in GITHUB_TOKEN opens the PR, so it needs write scope. This also
# requires "Allow GitHub Actions to create and approve pull requests" to be
# enabled for the repo (Settings → Actions → General). If a DOCS_REPO_PR_TOKEN
# secret is present it is used instead — a PAT lets the PR trigger the normal
# CI checks, which a GITHUB_TOKEN-authored PR does not.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: regenerate and open PR
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (matching the api-docs templates) so upstream
      # tag movement cannot alter workflow code without review.
      # persist-credentials: false is required by create-pull-request — without
      # it, checkout's stored token and the action's own token produce two
      # Authorization headers and git fails with "Duplicate header" / HTTP 400.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No setup-python: the generator is pure stdlib and GitHub-hosted runners
      # ship Python 3, matching i18n-parity.yml.
      - name: Regenerate changelog from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_changelog.py

      - name: Open PR if the changelog changed
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          # Prefer the bot PAT if present (its PRs trigger CI); otherwise fall
          # back to the built-in token, which the permissions block covers.
          token: ${{ secrets.DOCS_REPO_PR_TOKEN || github.token }}
          # Attribute to the org bot account, matching the api-docs sync.
          author: 'resq-sw <engineer@resq.software>'
          committer: 'resq-sw <engineer@resq.software>'
          commit-message: 'docs(changelog): sync SDK release versions'
          title: 'docs(changelog): sync SDK release versions'
          body: |
            Auto-generated by `${{ github.workflow }}` (run: ${{ github.run_id }}).

            Regenerated the `CHANGELOG:AUTOGEN` region of `changelog.mdx` from
            GitHub release data across the SDK repos. Version tables only —
            editorial prose in `automation/changelog-notes.md` is untouched.

            If a new release deserves narrative, add a `## YYYY-MM` note in that
            file and the next sync will splice it in.
          branch: auto/changelog-sync
          base: main
          delete-branch: true
          add-paths: changelog.mdx
          labels: |
            automated
            docs:changelog
