#
# i18n parity check — informational only. Reports pages in the
# default-language tree that are missing from each locale (ar, es, hi, zh),
# and pages that exist but are structurally short: fewer code blocks,
# headings, or components than the base page. Does not block merges;
# translations lag deliberately.

name: i18n parity

on:
  pull_request:
    paths:
      - '**/*.mdx'
      - '**/*.md'
      - 'ar/**'
      - 'es/**'
      - 'hi/**'
      - 'zh/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: locale parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-python step: the script is pure stdlib and GitHub-hosted
      # runners ship Python 3. Avoids an action pin that only ever goes stale.
      - name: Compare locale trees
        run: python3 scripts/i18n_parity.py --root .
