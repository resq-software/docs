#
# `required` status check — single aggregate gate referenced by the org
# ruleset (default-branch-baseline). Real CI jobs run in parallel, and
# the `required` job fails unless every dependency succeeds. Add new
# blocking docs jobs to `needs:` rather than a new workflow, so the
# protection contract stays one check.

name: required

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mintlify:
    name: mintlify (broken links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Mintlify CLI
        run: npm install -g mint
      - name: Check broken internal links
        run: mint broken-links

  spectral:
    name: spectral (OpenAPI lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint OpenAPI specs
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # v0.8.13
        with:
          file_glob: 'specs/*.json'

  pwa-manifest:
    name: pwa manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest.webmanifest
        run: |
          set -euo pipefail
          f=manifest.webmanifest
          if [[ ! -f "$f" ]]; then
            echo "::notice::$f not on this branch — skipping validation (manifest lives in feat/brand-assets PR)"
            exit 0
          fi
          jq -e . "$f" > /dev/null || { echo "::error::$f is not valid JSON"; exit 1; }
          for field in name short_name start_url display icons; do
            if ! jq -e "has(\"$field\")" "$f" > /dev/null; then
              echo "::error::manifest missing required field: $field"
              exit 1
            fi
          done
          mapfile -t srcs < <(jq -r '.icons[].src' "$f")
          missing=0
          for src in "${srcs[@]}"; do
            path="${src#/}"
            if [[ ! -f "$path" ]]; then
              echo "::error::icon path not found on disk: $src"
              missing=$((missing+1))
            fi
          done
          if (( missing > 0 )); then
            echo "::error::$missing icon(s) missing"
            exit 1
          fi
          echo "manifest valid: ${#srcs[@]} icons resolved"

  content-guard:
    name: content guard (deletion floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the PR base is reachable for the diff.
          fetch-depth: 0
      - name: Guard against silent mass deletion of generated docs
        # The SDK auto-doc pipeline rm -rf's its target dir before
        # copying freshly generated output, so a failed or partial
        # generation surfaces here as a spike in deleted pages under
        # sdks/**. A clean version bump deletes ~0. Broken-links stays
        # green in that case (the dropped pages leave nav too), so this
        # is the backstop that catches the regression. Intentional bulk
        # restructures carry the `docs:bulk-change` label to opt out.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MAX_DELETIONS: '20'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull_request event ($EVENT); deletion floor n/a"
            exit 0
          fi
          if printf '%s' "$PR_LABELS" | jq -e 'index("docs:bulk-change")' >/dev/null; then
            echo "docs:bulk-change label present; skipping deletion floor"
            exit 0
          fi
          mapfile -t deleted < <(
            git diff --diff-filter=D --name-only \
              "origin/${BASE_REF}...HEAD" -- 'sdks/**' \
              | grep -E '\.(md|mdx)$' || true
          )
          n=${#deleted[@]}
          echo "deleted SDK doc pages vs origin/${BASE_REF}: $n (threshold $MAX_DELETIONS)"
          if (( n > MAX_DELETIONS )); then
            printf '%s\n' "${deleted[@]}" | sed 's/^/  - /'
            echo "::error::$n SDK doc pages deleted (> $MAX_DELETIONS)."
            echo "::error::A failed/partial generation can silently drop a package's docs."
            echo "::error::If this deletion is intentional, add the 'docs:bulk-change' label."
            exit 1
          fi
          echo "deletion floor OK"

  # ── Private-name guard ──────────────────────────────────────────────
  # Called from here and not from security.yml: `needs:` cannot reach across
  # workflow files, and the org ruleset watches only the `required` context.
  # A guard that reports into nothing cannot stop a merge, however loudly it
  # fails.
  private-name-guard:
    name: private-name-guard
    # Dependabot's restricted context resolves Actions secrets to empty, so
    # the guard cannot authenticate on its pull requests. The aggregate below
    # tolerates the resulting skip for that actor alone.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/private-name-guard.yml@03bd2fc8788be394d96edebcaceb3b3735bb2cbc # main
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  required:
    name: required
    needs: [mintlify, spectral, pwa-manifest, content-guard, private-name-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        env:
          GUARD: ${{ needs.private-name-guard.result }}
          ACTOR: ${{ github.actor }}
        run: |
          mintlify="${{ needs.mintlify.result }}"
          spectral="${{ needs.spectral.result }}"
          pwa="${{ needs.pwa-manifest.result }}"
          guard="${{ needs.content-guard.result }}"
          echo "mintlify:      $mintlify"
          echo "spectral:      $spectral"
          echo "pwa-manifest:  $pwa"
          echo "content-guard: $guard"
          if [[ "$mintlify" != "success" || "$spectral" != "success" || "$pwa" != "success" || "$guard" != "success" ]]; then
            echo "::error::One or more required gates failed"
            exit 1
          fi
          # The guard is strict: a SKIPPED guard means no check ran, which is
          # also the fork case -- a fork cannot reach PRIVATE_NAME_GUARD_TOKEN,
          # so it fails closed and needs a maintainer to re-run from a branch
          # here. This aggregate is the only context the org ruleset watches,
          # so anything tolerated here is tolerated at merge. Dependabot is the
          # single allowed skip, for the reason given on the job itself.
          case "$ACTOR:$GUARD" in
            "dependabot[bot]:skipped"|*":success") echo "ok: private-name-guard=$GUARD" ;;
            *) echo "::error::private-name-guard returned: $GUARD"; exit 1 ;;
          esac
          echo "All required gates passed"
